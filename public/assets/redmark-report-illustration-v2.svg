<svg width="760" height="460" viewBox="0 0 760 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Redmark downloadable security report illustration</title>
  <desc id="desc">A soft report preview with findings summary, risk distribution, and an export PDF action.</desc>

  <defs>
    <filter id="paperShadow" x="-16%" y="-14%" width="132%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#26383C" flood-opacity="0.13"/>
    </filter>
    <filter id="softShadow" x="-16%" y="-20%" width="132%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#26383C" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="riskArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F15A43"/>
      <stop offset="1" stop-color="#D9442E"/>
    </linearGradient>
  </defs>

  <!-- Background list context, inspired by the second reference image. -->
  <g opacity="0.48" filter="url(#softShadow)">
    <rect x="88" y="56" width="244" height="308" rx="18" fill="#F9F8F5"/>
    <rect x="88.75" y="56.75" width="242.5" height="306.5" rx="17.25" stroke="#DADDD8" stroke-width="1.5"/>
    <rect x="110" y="78" width="28" height="28" rx="8" fill="#E8F4EE"/>
    <path d="M119 87H129M119 93H129M119 99H126" stroke="#69C69D" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="151" y="87" width="104" height="9" rx="4.5" fill="#E3E1DE"/>
    <rect x="110" y="127" width="194" height="30" rx="10" fill="#EDF7F2"/>
    <circle cx="125" cy="142" r="6" fill="#67C699"/>
    <rect x="139" y="137" width="88" height="10" rx="5" fill="#69C69D"/>
    <g fill="#E4E6E2">
      <rect x="110" y="177" width="9" height="9" rx="3"/><rect x="130" y="177" width="96" height="9" rx="4.5"/>
      <rect x="110" y="207" width="9" height="9" rx="3"/><rect x="130" y="207" width="72" height="9" rx="4.5"/>
      <rect x="110" y="237" width="9" height="9" rx="3"/><rect x="130" y="237" width="112" height="9" rx="4.5"/>
      <rect x="110" y="267" width="9" height="9" rx="3"/><rect x="130" y="267" width="88" height="9" rx="4.5"/>
      <rect x="110" y="297" width="9" height="9" rx="3"/><rect x="130" y="297" width="68" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- Report paper: distinct portrait composition for the REPORT card. -->
  <g filter="url(#paperShadow)">
    <rect x="282" y="38" width="376" height="374" rx="18" fill="#FBFAF7"/>
    <rect x="282.75" y="38.75" width="374.5" height="372.5" rx="17.25" stroke="#DADDD8" stroke-width="1.5"/>

    <text x="310" y="71" fill="#8B9998" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">Redmark</text>
    <rect x="596" y="54" width="39" height="27" rx="8" fill="#FCE6E0"/>
    <text x="615.5" y="71" text-anchor="middle" fill="#D9553F" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="10" font-weight="700">PDF</text>
    <rect x="310" y="96" width="320" height="1.5" fill="#E4E6E2"/>

    <text x="310" y="137" fill="#36474B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="20" font-weight="700">Vulnerability Scan Report</text>
    <text x="310" y="160" fill="#A1AAA6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">SCAN SUMMARY</text>

    <!-- Summary module with total findings and compact risk ring. -->
    <rect x="310" y="179" width="320" height="82" rx="12" fill="#FFFFFF"/>
    <rect x="310.75" y="179.75" width="318.5" height="80.5" rx="11.25" stroke="#DADDD8" stroke-width="1.5"/>
    <text x="332" y="232" fill="#36474B" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400">14</text>
    <text x="384" y="224" fill="#7D8987" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="10" font-weight="650" letter-spacing="1.1">FINDINGS</text>
    <g transform="translate(585 220) rotate(-90)">
      <circle r="22" stroke="#E3E8E4" stroke-width="7"/>
      <circle r="22" stroke="url(#riskArc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="62 138"/>
      <circle r="22" stroke="#E8B05B" stroke-width="7" stroke-linecap="round" stroke-dasharray="22 138" stroke-dashoffset="-67"/>
    </g>

    <!-- Risk distribution bars, kept intentionally simple. -->
    <text x="310" y="291" fill="#A1AAA6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">RISK DISTRIBUTION</text>
    <rect x="310" y="357" width="320" height="1.5" fill="#E4E6E2"/>
    <rect x="327" y="337" width="43" height="20" rx="4" fill="#C7DDE0"/>
    <rect x="380" y="320" width="43" height="37" rx="4" fill="#E8B567"/>
    <rect x="433" y="307" width="43" height="50" rx="4" fill="#E94A25"/>
    <rect x="486" y="328" width="43" height="29" rx="4" fill="#A9C4C7"/>
    <rect x="539" y="344" width="43" height="13" rx="4" fill="#D8E3DF"/>

    <!-- Export state -->
    <rect x="310" y="375" width="178" height="22" rx="11" fill="#EDF7F2"/>
    <circle cx="325" cy="386" r="5" fill="#69A882"/>
    <text x="338" y="390" fill="#5C806C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="10" font-weight="650">報告已準備完成</text>
  </g>
</svg>
