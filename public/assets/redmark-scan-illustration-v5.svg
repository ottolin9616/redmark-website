<svg width="760" height="360" viewBox="0 0 760 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Redmark scan target and scan type selection</title>
  <desc id="desc">A minimal scan setup interface with a target field and two vulnerability scan type options.</desc>

  <defs>
    <filter id="fieldShadow" x="-10%" y="-24%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#26383C" flood-opacity="0.09"/>
    </filter>
    <filter id="optionShadow" x="-10%" y="-24%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#26383C" flood-opacity="0.07"/>
    </filter>
  </defs>

  <g filter="url(#fieldShadow)">
    <rect x="24" y="50" width="712" height="68" rx="16" fill="#FBFAF7"/>
    <rect x="24.75" y="50.75" width="710.5" height="66.5" rx="15.25" stroke="#DADDD8" stroke-width="1.5"/>
    <text x="48" y="91" fill="#36474B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="16" font-weight="550">https://example.com</text>
    <path d="M704 78L712 86L720 78" stroke="#8B9692" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Selected scan type -->
  <g filter="url(#optionShadow)" transform="translate(0 -18)">
    <rect x="24" y="186" width="346" height="118" rx="16" fill="#FBFAF7"/>
    <rect x="24.75" y="186.75" width="344.5" height="116.5" rx="15.25" stroke="#E24017" stroke-width="1.5"/>
    <circle cx="52" cy="226" r="12" fill="#FFF0EA" stroke="#E24017" stroke-width="1.8"/>
    <circle cx="52" cy="226" r="5" fill="#E24017"/>
    <text x="82" y="232" fill="#36474B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="15" font-weight="650">Web 基礎弱點掃描</text>
  </g>

  <!-- Unselected scan type -->
  <g filter="url(#optionShadow)" transform="translate(0 -18)">
    <rect x="390" y="186" width="346" height="118" rx="16" fill="#F9F8F5"/>
    <rect x="390.75" y="186.75" width="344.5" height="116.5" rx="15.25" stroke="#DADDD8" stroke-width="1.5"/>
    <circle cx="418" cy="226" r="12" fill="#F9F8F5" stroke="#BFC8C6" stroke-width="1.8"/>
    <text x="448" y="232" fill="#78817E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', Arial, sans-serif" font-size="15" font-weight="600">Web 動態弱點掃描</text>
  </g>
</svg>
